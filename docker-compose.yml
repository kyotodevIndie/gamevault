services:
  postgres:
    image: postgres:16-alpine
    container_name: gamevault_postgres
    environment:
      POSTGRES_USER: gamevault
      POSTGRES_PASSWORD: gamevault
      POSTGRES_DB: gamevault
    ports:
      - "5432:5432"
    volumes:
      - gamevault_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamevault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gamevault_redis
    ports:
      - "6379:6379"
    volumes:
      - gamevault_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gamevault_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gamevault
      MINIO_ROOT_PASSWORD: gamevault123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gamevault_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gamevault_postgres_data:
  gamevault_redis_data:
  gamevault_minio_data: