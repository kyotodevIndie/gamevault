services:
  postgres:
    image: postgres:16-alpine
    container_name: gamevault_postgres
    environment:
      POSTGRES_USER: gamevault
      POSTGRES_PASSWORD: gamevault
      POSTGRES_DB: gamevault
    ports:
      - "5432:5432"
    volumes:
      - gamevault_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamevault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gamevault_redis
    ports:
      - "6379:6379"
    volumes:
      - gamevault_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gamevault_postgres_data:
  gamevault_redis_data: